<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 100" width="250" height="100" role="img" aria-label="ANPC - Soluționarea Alternativă a Litigiilor">
  <rect x="1.5" y="1.5" width="247" height="97" rx="14" fill="#ffffff" stroke="#1d428a" stroke-width="3"/>
  <!-- Romanian tricolor accent bar -->
  <path d="M15 3 H85 V7 H15 Z" fill="#002B7F"/>
  <path d="M85 3 H165 V7 H85 Z" fill="#FCD116"/>
  <path d="M165 3 H235 V7 H165 Z" fill="#CE1126"/>

  <!-- Left ANPC shield/emblem -->
  <g transform="translate(16, 20)">
    <rect x="0" y="0" width="52" height="58" rx="8" fill="#1d428a"/>
    <!-- EU stars arc -->
    <circle cx="26" cy="14" r="1.5" fill="#FCD116"/>
    <circle cx="19" cy="16" r="1.5" fill="#FCD116"/>
    <circle cx="33" cy="16" r="1.5" fill="#FCD116"/>
    <circle cx="14" cy="21" r="1.5" fill="#FCD116"/>
    <circle cx="38" cy="21" r="1.5" fill="#FCD116"/>
    <text x="26" y="38" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">ANPC</text>
    <text x="26" y="50" font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="700" fill="#FCD116" text-anchor="middle" letter-spacing="1">SAL</text>
  </g>

  <!-- Main Text -->
  <text x="155" y="29" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="800" fill="#1d428a" text-anchor="middle">SOLUȚIONAREA</text>
  <text x="155" y="44" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="800" fill="#1d428a" text-anchor="middle">ALTERNATIVĂ</text>
  <text x="155" y="59" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="800" fill="#1d428a" text-anchor="middle">A LITIGIILOR</text>

  <!-- DETALII pill -->
  <rect x="110" y="67" width="90" height="20" rx="10" fill="#1d428a"/>
  <text x="155" y="81" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">DETALII</text>
</svg>
