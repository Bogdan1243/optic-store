{% extends 'base.html' %}
{% block content %}

<style>
    /* 🪞 SMART MIRROR CSS */
    .ar-wrapper {
        position: relative;
        width: 100%;
        max-width: 720px;
        margin: 0 auto;
        background-color: #000;
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 25px 50px rgba(0,0,0,0.15);
        border: 4px solid #fff;
    }

    #video {
        width: 100%;
        height: auto;
        display: block;
        transform: scaleX(-1); /* Mirror effect */
        object-fit: cover;
    }

    #overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        transform: scaleX(-1); /* Mirror effect to match video */
        pointer-events: none; /* Let clicks pass through to the video if needed */
    }

    /* Frosted glass status pill */
    .status-pill {
        position: absolute;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding: 10px 24px;
        border-radius: 50px;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #333;
        z-index: 10;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        white-space: nowrap;
        transition: all 0.3s ease;
    }

    /* Bottom cinematic gradient */
    .mirror-controls {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        padding: 40px 20px 24px 20px;
        background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
        z-index: 10;
        text-align: center;
    }
</style>

<div class="container py-5 mt-3" style="min-height: 80vh;">

<div class="container py-5 mt-3" style="min-height: 80vh;">

    <div class="text-center mb-5">
        <h2 class="premium-heading display-4 mb-2">Probă Virtuală AR</h2>
        <p class="text-muted text-uppercase small" style="letter-spacing: 1px;">Probei în prezent: <strong class="text-dark">{{ product.brand }}</strong></p>
    </div>

    <div class="ar-wrapper">

        <div class="status-pill" id="statusBox">
            <span id="status">Se încarcă modelele AI...</span>
        </div>

        <video id="video" autoplay muted playsinline></video>
        <canvas id="overlay"></canvas>

        <div class="mirror-controls">
            <a href="{% url 'product_detail' product.slug %}" class="btn btn-light px-5 py-3 text-uppercase rounded-pill fw-bold shadow" style="letter-spacing: 1px; font-size: 0.8rem;">
                Încheie Proba
            </a>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<script>
    if (typeof faceapi === 'undefined') {
        document.getElementById('status').innerText = "Modul AI Blocat (Dezactivează AdBlock)";
        document.getElementById('statusBox').style.background = "rgba(255, 0, 0, 0.8)";
        document.getElementById('statusBox').style.color = "white";
        console.error("faceapi is not defined - Script failed to load.");
    } else {
        const video = document.getElementById('video');
        const canvas = document.getElementById('overlay');
        const status = document.getElementById('status');
        const glassesImg = new Image();

        glassesImg.src = "{% if product.ar_image %}{{ product.ar_image.url|escapejs }}{% endif %}";
        const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';

        // 1. Load AI Models
        status.innerText = "Se încarcă modulul AI... 🧠";

        Promise.all([
            faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
            faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
        ]).then(startVideo).catch(err => {
            console.error(err);
            status.innerText = "Eroare Model AI";
        });

        // 2. Start Webcam
        function startVideo() {
            status.innerText = "Se solicită accesul la cameră... 📸";
            navigator.mediaDevices.getUserMedia({ video: {} })
                .then(stream => {
                    video.srcObject = stream;
                    status.innerText = "Se detectează fața... ⏳";
                })
                .catch(err => {
                    console.error(err);
                    status.innerText = "Accesul la cameră a fost refuzat";
                    document.getElementById('statusBox').style.background = "rgba(255, 0, 0, 0.8)";
                    document.getElementById('statusBox').style.color = "white";
                });
        }

        // 3. The AR Loop
        video.addEventListener('play', () => {
            const displaySize = { width: video.clientWidth, height: video.clientHeight };
            faceapi.matchDimensions(canvas, displaySize);

            setInterval(async () => {
                const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks();
                const resizedDetections = faceapi.resizeResults(detections, displaySize);

                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (resizedDetections.length > 0) {
                    status.innerText = "Potrivire Perfectă 😎";

                    resizedDetections.forEach(detection => {
                        const landmarks = detection.landmarks;
                        const leftEye = landmarks.getLeftEye();
                        const rightEye = landmarks.getRightEye();

                        const eyeCenterX = (leftEye[0].x + rightEye[3].x) / 2;
                        const eyeCenterY = (leftEye[0].y + rightEye[3].y) / 2;
                        const eyeDist = Math.hypot(rightEye[3].x - leftEye[0].x, rightEye[3].y - leftEye[0].y);

                        const scale = 2.5;
                        const width = eyeDist * scale;
                        const height = width * (glassesImg.height / glassesImg.width);
                        const angle = Math.atan2(rightEye[3].y - leftEye[0].y, rightEye[3].x - leftEye[0].x);

                        ctx.save();
                        ctx.translate(eyeCenterX, eyeCenterY);
                        ctx.rotate(angle);
                        ctx.drawImage(glassesImg, -width / 2, -height / 2, width, height);
                        ctx.restore();
                    });
                } else {
                    status.innerText = "Se caută chipul... 🔍";
                }
            }, 100);
        });
    }
</script>

{% endblock %}
