{% extends 'base.html' %}
{% block content %}

<div class="container py-5 my-5" style="min-height: 60vh;">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="text-center mb-5">
                <h1 class="premium-heading display-4 mb-2">Email Trimis</h1>
                <p class="text-muted small text-uppercase" style="letter-spacing: 2px;">Verifică-ți inbox-ul</p>
            </div>

            <div class="bg-white p-4 p-md-5 border rounded-0 shadow-sm text-center">
                <p class="mb-4">Dacă există un cont asociat adresei de email introduse, vei primi un link de resetare a parolei în câteva minute.</p>
                <p class="text-muted small">Nu ai primit emailul? Verifică și folderul de spam.</p>

                <div class="pt-4 border-top mt-4">
                    <a href="{% url 'login' %}" class="text-dark fw-bold text-decoration-none border-bottom border-dark pb-1" style="letter-spacing: 1px;">Înapoi la Autentificare</a>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
