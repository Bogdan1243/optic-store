{% extends 'base.html' %}
{% block content %}

<div class="container py-5 my-5" style="min-height: 60vh;">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="text-center mb-5">
                <h1 class="premium-heading display-4 mb-2">Parolă Nouă</h1>
                <p class="text-muted small text-uppercase" style="letter-spacing: 2px;">Alege o parolă nouă pentru contul tău</p>
            </div>

            <div class="bg-white p-4 p-md-5 border rounded-0 shadow-sm">
                <form method="POST">
                    {% csrf_token %}

                    {% if form.errors %}
                        <div class="alert alert-danger rounded-0 mb-4 small">
                            Te rugăm să corectezi erorile de mai jos.
                        </div>
                    {% endif %}

                    <div class="mb-4">
                        <label class="small text-uppercase fw-bold mb-2 d-block" style="letter-spacing: 1px;">Parolă Nouă</label>
                        <input type="password" class="form-control rounded-0 py-3 px-3" name="new_password1" placeholder="Introdu parola nouă" required style="background-color: #fafafa; border: 1px solid #e5e5e5;">
                    </div>

                    <div class="mb-4">
                        <label class="small text-uppercase fw-bold mb-2 d-block" style="letter-spacing: 1px;">Confirmă Parola</label>
                        <input type="password" class="form-control rounded-0 py-3 px-3" name="new_password2" placeholder="Confirmă parola nouă" required style="background-color: #fafafa; border: 1px solid #e5e5e5;">
                    </div>

                    <button type="submit" class="btn btn-premium w-100 py-3 mb-4">Resetează Parola</button>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
