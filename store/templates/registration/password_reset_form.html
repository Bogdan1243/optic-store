{% extends 'base.html' %}
{% block content %}

<div class="container py-5 my-5" style="min-height: 60vh;">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="text-center mb-5">
                <h1 class="premium-heading display-4 mb-2">Resetare Parolă</h1>
                <p class="text-muted small text-uppercase" style="letter-spacing: 2px;">Introdu adresa de email asociată contului tău</p>
            </div>

            <div class="bg-white p-4 p-md-5 border rounded-0 shadow-sm">
                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-4">
                        <label class="small text-uppercase fw-bold mb-2 d-block" style="letter-spacing: 1px;">Adresă Email</label>
                        <input type="email" class="form-control rounded-0 py-3 px-3" name="email" placeholder="Introdu adresa de email" required style="background-color: #fafafa; border: 1px solid #e5e5e5;">
                    </div>

                    <button type="submit" class="btn btn-premium w-100 py-3 mb-4">Trimite Link de Resetare</button>
                </form>

                <div class="text-center pt-4 border-top">
                    <p class="text-muted small mb-0">
                        Ți-ai amintit parola?
                        <a href="{% url 'login' %}" class="text-dark fw-bold text-decoration-none border-bottom border-dark pb-1 ms-1" style="letter-spacing: 1px;">Autentifică-te</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
